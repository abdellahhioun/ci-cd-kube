apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ci-cd-kube-hpa
  labels:
    app: ci-cd-kube
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ci-cd-kube-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
