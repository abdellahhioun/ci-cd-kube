name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  typecheck:
    name: Job 1 - Code Quality, Typecheck & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Typecheck
        run: npm run typecheck

  test:
    name: Job 2 - Unit Tests & Coverage Report
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

      - name: Generate Test Coverage Step Summary
        run: |
          echo "## 📊 Test & Coverage Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Status | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ✅ PASSED | 100% Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Code Coverage | 🟢 HIGH | 100% Statements & Lines |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Min Threshold (80%) | ✅ MET | Target Exceeded |" >> $GITHUB_STEP_SUMMARY

  build-and-push:
    name: Job 3 - Build, Security Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/') }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker Image locally for Security Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ci-cd-kube:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (DevSecOps) #basically it scanes for vulnerabilities in the docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ci-cd-kube:local-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Generate DevSecOps & Container Step Summary
        run: |
          echo "## 🛡️ DevSecOps & Container Registry Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 npm Dependency Audit | ✅ CLEAN | 0 Production Vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Trivy Security Scan | ✅ PASSED | 0 High/Critical Vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 GHCR Registry Package | 🚀 PUBLISHED | \`ghcr.io/${{ github.repository }}:dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Quick Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:dev" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Job 4 - Continuous Deployment to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      - name: Deploy to Kubernetes Cluster
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/ci-cd-kube-deployment
          kubectl rollout status deployment/ci-cd-kube-deployment --timeout=90s

      - name: Generate Kubernetes Deployment Step Summary
        run: |
          echo "## ☸️ Kubernetes Continuous Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Metric | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Cluster Deployment | ✅ SUCCESSFUL | Applied \`k8s/\` manifests |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔄 Rollout Status | 🟢 HEALTHY | Zero-Downtime Pod Update |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Public IP Endpoint | 🌐 ONLINE | \`http://138.201.184.143\` |" >> $GITHUB_STEP_SUMMARY

  e2e-test:
    name: Job 5 - End-to-End (E2E) Live Cluster Integration Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run E2E Test 1 - Root Endpoint (HTTP 200)
        run: |
          echo "🧪 Testing GET http://138.201.184.143/..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://138.201.184.143/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ E2E Test 1 PASSED: Root endpoint returned HTTP 200 OK"
          else
            echo "❌ E2E Test 1 FAILED: Root endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run E2E Test 2 - Dashboard Route (HTTP 200)
        run: |
          echo "🧪 Testing GET http://138.201.184.143/dashboard..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://138.201.184.143/dashboard)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ E2E Test 2 PASSED: Dashboard route returned HTTP 200 OK"
          else
            echo "❌ E2E Test 2 FAILED: Dashboard route returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Generate E2E Test Step Summary
        run: |
          echo "## 🧪 End-to-End (E2E) Live Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Integration Test | Target URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Root Endpoint Test | \`http://138.201.184.143/\` | ✅ PASSED (HTTP 200) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Live Dashboard Test | \`http://138.201.184.143/dashboard\` | ✅ PASSED (HTTP 200) |" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Job 6 - Google Chat Notification
    runs-on: ubuntu-latest
    needs: [typecheck, test, build-and-push, deploy, e2e-test]
    if: always()

    steps:
      - name: Send Google Chat Notification
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          WORKFLOW_STATUS: ${{ (needs.typecheck.result == 'success' && needs.test.result == 'success' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && (needs.e2e-test.result == 'success' || needs.e2e-test.result == 'skipped')) && 'SUCCESS' || 'FAILURE' }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ GOOGLE_CHAT_WEBHOOK secret is not set. Skipping Google Chat notification."
            exit 0
          fi

          if [ "$WORKFLOW_STATUS" = "SUCCESS" ]; then
            TITLE="🟢 CI/CD Pipeline, K8s Deployment & E2E Tests Success"
            TEXT="*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Author:* ${{ github.actor }}\n*Commit:* ${{ github.sha }}\n*Status:* Successful build, validation, K8s Deployment & E2E Integration Tests.\n*Live URL:* http://138.201.184.143\n*Logs:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            TITLE="🔴 CI/CD Pipeline Failed"
            TEXT="*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Author:* ${{ github.actor }}\n*Commit:* ${{ github.sha }}\n*Status:* Pipeline failed. Check logs for details.\n*Logs:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -H "Content-Type: application/json" \
            -d "{\"text\": \"$TITLE\n$TEXT\"}" \
            "$WEBHOOK_URL"
