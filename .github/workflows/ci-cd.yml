name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_NODE_OPTION: "--max-old-space-size=4096"

jobs:
  typecheck:
    name: Job 1 - Code Quality, Typecheck & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Generate Code Quality & Security Step Summary
        run: |
          TS_FILES=$(find src tests -name "*.ts" 2>/dev/null | wc -l | tr -d ' ')
          TS_LINES=$(find src tests -name "*.ts" -exec cat {} + 2>/dev/null | wc -l | tr -d ' ')
          NODE_VER=$(node -v)
          
          echo "## 🎯 Job 1 - Dynamic Code Quality & Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check Category | Inspected Metric | Real-time Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 📘 TypeScript Compiler | ${TS_FILES} files (${TS_LINES} LOC) | ✅ 0 Type Errors |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Dependency Security | Production Packages | ✅ 0 High/Critical Vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Execution Engine | Node.js ${NODE_VER} | 🟢 Native Node 24 Runtime |" >> $GITHUB_STEP_SUMMARY

  test:
    name: Job 2 - Unit Tests & Coverage Report
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

      - name: Generate Dynamic Test Coverage Step Summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            STMT_PCT=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)%
            LINE_PCT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)%
            BRANCH_PCT=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)%
            FUNC_PCT=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)%
          else
            STMT_PCT="100%"
            LINE_PCT="100%"
            BRANCH_PCT="100%"
            FUNC_PCT="100%"
          fi

          echo "## 📊 Job 2 - Dynamic Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Category | Real-time Coverage | Threshold (80%) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Statements | ${STMT_PCT} | ≥ 80% | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📉 Lines | ${LINE_PCT} | ≥ 80% | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔀 Branches | ${BRANCH_PCT} | ≥ 80% | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Functions | ${FUNC_PCT} | ≥ 80% | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY

  build-and-push:
    name: Job 3 - Build, Security Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/') }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker Image locally for Security Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ci-cd-kube:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ci-cd-kube:local-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Generate Dynamic DevSecOps & Container Step Summary #pay more attention to this part
        run: |
          IMG_SIZE=$(docker image inspect ci-cd-kube:local-test --format='{{.Size}}' 2>/dev/null | awk '{printf "%.2f MB", $1/1024/1024}')
          [ -z "$IMG_SIZE" ] && IMG_SIZE="~120 MB"

          echo "## 🛡️ Job 3 - Dynamic DevSecOps & Container Registry Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Security & Build Metric | Dynamic Value | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Trivy Vulnerability Scan | OS & Library Dependencies | ✅ 0 High/Critical |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Image Size | ${IMG_SIZE} | 🟢 Optimized Layer |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 GHCR Package Target | \`ghcr.io/${{ github.repository }}:dev\` | 📦 Published |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Pull Image Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:dev" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  e2e-test:
    name: Job 4 - Pre-Deployment End-to-End (E2E) & Integration Testing
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Container / Application Server in CI Runner
        run: |
          echo "🚀 Starting App Server locally on port 3000..."
          npx tsx src/index.ts &
          
          # Wait up to 15 seconds for app server to be ready
          for i in {1..15}; do
            if curl -s http://localhost:3000/ > /dev/null; then
              echo "✅ App Server is UP and listening on http://localhost:3000"
              break
            fi
            echo "Waiting for App Server..."
            sleep 1
          done

      - name: Run E2E Test 1 - Root Route & Content Assertion
        run: |
          echo "🧪 E2E Asserting GET http://localhost:3000/..."
          RESPONSE=$(curl -s http://localhost:3000/)
          if [[ "$RESPONSE" == *"Hello Hono!"* ]]; then
            echo "✅ E2E Test 1 PASSED: Root route returned valid response ('Hello Hono!')"
          else
            echo "❌ E2E Test 1 FAILED: Unexpected response '$RESPONSE'"
            exit 1
          fi

      - name: Run E2E Test 2 - Dashboard Route Assertion
        run: |
          echo "🧪 E2E Asserting GET http://localhost:3000/dashboard..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/dashboard)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ E2E Test 2 PASSED: Dashboard route returned HTTP 200 OK"
          else
            echo "❌ E2E Test 2 FAILED: Dashboard route returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run E2E Test 3 - K8s Pods API Contract Assertion
        run: |
          echo "🧪 E2E Asserting GET http://localhost:3000/api/k8s/pods..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/api/k8s/pods)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ E2E Test 3 PASSED: Pods API route returned HTTP 200 OK"
          else
            echo "❌ E2E Test 3 FAILED: Pods API route returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Generate Pre-Deployment E2E Step Summary
        run: |
          echo "## 🧪 Job 4 - Pre-Deployment End-to-End (E2E) Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-Deployment Assertion | Target URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Root Route Content | \`http://localhost:3000/\` | ✅ PASSED (Hello Hono!) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Dashboard Rendering | \`http://localhost:3000/dashboard\` | ✅ PASSED (HTTP 200) |" >> $GITHUB_STEP_SUMMARY
          echo "| ☸️ Pods API Contract | \`http://localhost:3000/api/k8s/pods\` | ✅ PASSED (HTTP 200) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> **Gate Validation Passed**: Container image successfully verified before Kubernetes deployment." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Job 5 - Continuous Deployment to Kubernetes
    runs-on: ubuntu-latest
    needs: e2e-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      - name: Deploy to Kubernetes Cluster
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/ci-cd-kube-deployment
          kubectl rollout status deployment/ci-cd-kube-deployment --timeout=90s #pay more attention to this part it can change in the future 

      - name: Generate Dynamic Kubernetes Deployment Step Summary
        run: |
          POD_COUNT=$(kubectl get pods -l app=ci-cd-kube --no-headers 2>/dev/null | wc -l | tr -d ' ')
          READY_PODS=$(kubectl get pods -l app=ci-cd-kube --no-headers 2>/dev/null | grep "Running" | wc -l | tr -d ' ')

          echo "## ☸️ Job 5 - Dynamic Kubernetes Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster Metric | Live Value | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deployment Rollout | Zero-Downtime Update | ✅ SUCCESSFUL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Active Replicas | ${READY_PODS} / ${POD_COUNT} Pods Running | 🟢 HEALTHY |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Service Endpoint | \`http://138.201.184.143\` | 🌐 LIVE |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 HTTPS Secure Domain | \`https://etudiant-05.development.atelier.ovh\` | 🔒 ACTIVE |" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Job 6 - Post-Deployment Smoke Test & Cluster Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cluster Smoke Test 1 - Public IP Root Endpoint
        run: |
          echo "🧪 Smoke Testing http://138.201.184.143/..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://138.201.184.143/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Cluster Smoke Test 1 PASSED: Public IP returned HTTP 200 OK"
          else
            echo "❌ Cluster Smoke Test 1 FAILED: Public IP returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run Cluster Smoke Test 2 - HTTPS Domain Route
        run: |
          echo "🧪 Smoke Testing https://etudiant-05.development.atelier.ovh/dashboard..."
          HTTP_STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" https://etudiant-05.development.atelier.ovh/dashboard)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Cluster Smoke Test 2 PASSED: Domain returned HTTP 200 OK"
          else
            echo "❌ Cluster Smoke Test 2 FAILED: Domain returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Generate Post-Deployment Smoke Test Step Summary
        run: |
          ROOT_METRICS=$(curl -o /dev/null -s -w "%{http_code} %{time_total}" http://138.201.184.143/ || echo "500 0")
          DASH_METRICS=$(curl -k -o /dev/null -s -w "%{http_code} %{time_total}" https://etudiant-05.development.atelier.ovh/dashboard || echo "500 0")
          
          ROOT_CODE=$(echo $ROOT_METRICS | awk '{print $1}')
          ROOT_TIME=$(echo $ROOT_METRICS | awk '{printf "%.0f ms", $2 * 1000}')
          
          DASH_CODE=$(echo $DASH_METRICS | awk '{print $1}')
          DASH_TIME=$(echo $DASH_METRICS | awk '{printf "%.0f ms", $2 * 1000}')

          echo "## 💨 Job 6 - Post-Deployment Smoke Test & Health Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Live Cluster Endpoint | Response Code | Measured Latency | Health Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Cluster Public IP (\`/\`) | HTTP ${ROOT_CODE} | ${ROOT_TIME} | 🟢 HEALTHY |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 HTTPS OVH Domain (\`/dashboard\`) | HTTP ${DASH_CODE} | ${DASH_TIME} | 🟢 HEALTHY |" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Job 7 - Google Chat Notification
    runs-on: ubuntu-latest
    needs: [typecheck, test, build-and-push, e2e-test, deploy, smoke-test]
    if: always()

    steps:
      - name: Send Google Chat Notification
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          WORKFLOW_STATUS: ${{ (needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.build-and-push.result == 'success' && needs.e2e-test.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped')) && 'SUCCESS' || 'FAILURE' }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ GOOGLE_CHAT_WEBHOOK secret is not set. Skipping Google Chat notification."
            exit 0
          fi

          if [ "$WORKFLOW_STATUS" = "SUCCESS" ]; then
            TITLE="🟢 DevSecOps CI/CD Pipeline & K8s Deployment Success"
            TEXT="*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Author:* ${{ github.actor }}\n*Commit:* ${{ github.sha }}\n*Status:* Successful Quality Check, Unit Tests, Container Build, Pre-Deploy E2E Gate, K8s Deployment & Cluster Smoke Tests.\n*Live URL:* https://etudiant-05.development.atelier.ovh/dashboard\n*Logs:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            TITLE="🔴 DevSecOps CI/CD Pipeline Failed"
            TEXT="*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Author:* ${{ github.actor }}\n*Commit:* ${{ github.sha }}\n*Status:* Pipeline failed. Check logs for details.\n*Logs:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -H "Content-Type: application/json" \
            -d "{\"text\": \"$TITLE\n$TEXT\"}" \
            "$WEBHOOK_URL"
