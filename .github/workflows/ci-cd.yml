name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  typecheck:
    name: Job 1 - Code Quality and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Report Quality Check Status
        run: |
          echo "## 🎯 Job 1 - Code Quality & Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "✅ TypeScript compilation and production dependency security audit passed successfully." >> $GITHUB_STEP_SUMMARY

  test:
    name: Job 2 - Unit Tests and Coverage
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

      - name: Report Unit Test Status
        run: |
          echo "## 📊 Job 2 - Unit Tests & Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "✅ Vitest unit test suite passed and code coverage report was generated." >> $GITHUB_STEP_SUMMARY

  build-and-push:
    name: Job 3 - Build and Security Scan Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/') }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ci-cd-kube:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ci-cd-kube:local-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Report DevSecOps Build Status
        run: |
          echo "## 🛡️ Job 3 - DevSecOps Build & Container Security" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker image built, Trivy vulnerability scan passed, and package pushed to GHCR." >> $GITHUB_STEP_SUMMARY

  e2e-test:
    name: Job 4 - Pre-Deployment Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start application server
        run: |
          echo "Starting application server on port 3000..."
          npx tsx src/index.ts &
          for i in {1..15}; do
            if curl -s http://localhost:3000/ > /dev/null; then
              echo "Application server is running."
              break
            fi
            sleep 1
          done

      - name: Verify root endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:3000/)
          if [[ "$RESPONSE" == *"Hello Hono!"* ]]; then
            echo "Root endpoint test passed."
          else
            echo "Root endpoint test failed."
            exit 1
          fi

      - name: Verify dashboard route
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/dashboard)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Dashboard route test passed."
          else
            echo "Dashboard route test failed."
            exit 1
          fi

      - name: Verify pods API endpoint
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/api/k8s/pods)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Pods API test passed."
          else
            echo "Pods API test failed."
            exit 1
          fi

      - name: Report Pre-Deployment E2E Status
        run: |
          echo "## 🧪 Job 4 - Pre-Deployment End-to-End (E2E) Validation" >> $GITHUB_STEP_SUMMARY
          echo "✅ All application routes and API contracts verified before Kubernetes deployment." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Job 5 - Continuous Deployment to Kubernetes
    runs-on: ubuntu-latest
    needs: e2e-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      - name: Deploy to Kubernetes cluster
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/ci-cd-kube-deployment
          kubectl rollout status deployment/ci-cd-kube-deployment --timeout=90s

      - name: Report Kubernetes Deployment Status
        run: |
          echo "## ☸️ Job 5 - Kubernetes Continuous Deployment" >> $GITHUB_STEP_SUMMARY
          echo "✅ Applied Kubernetes manifests and completed zero-downtime rollout." >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Job 6 - Post-Deployment Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify public IP endpoint
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://138.201.184.143/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Public IP smoke test passed."
          else
            echo "Public IP smoke test failed."
            exit 1
          fi

      - name: Verify domain endpoint
        run: |
          HTTP_STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" https://etudiant-05.development.atelier.ovh/dashboard)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Domain smoke test passed."
          else
            echo "Domain smoke test failed."
            exit 1
          fi

      - name: Report Post-Deployment Smoke Test Status
        run: |
          echo "## 💨 Job 6 - Post-Deployment Cluster Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "✅ Verified live cluster public IP and HTTPS domain health." >> $GITHUB_STEP_SUMMARY

  notify:
    name: Job 7 - Google Chat Notification
    runs-on: ubuntu-latest
    needs: [typecheck, test, build-and-push, e2e-test, deploy, smoke-test]
    if: always()

    steps:
      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          WORKFLOW_STATUS: ${{ (needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.build-and-push.result == 'success' && needs.e2e-test.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped')) && 'SUCCESS' || 'FAILURE' }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "GOOGLE_CHAT_WEBHOOK secret is not set. Skipping notification."
            exit 0
          fi

          if [ "$WORKFLOW_STATUS" = "SUCCESS" ]; then
            TITLE="CI/CD Pipeline Success"
            TEXT="Repository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nCommit: ${{ github.sha }}\nStatus: Pipeline completed successfully."
          else
            TITLE="CI/CD Pipeline Failed"
            TEXT="Repository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nCommit: ${{ github.sha }}\nStatus: Pipeline failed. Check logs for details."
          fi

          curl -H "Content-Type: application/json" \
            -d "{\"text\": \"$TITLE\n$TEXT\"}" \
            "$WEBHOOK_URL"
